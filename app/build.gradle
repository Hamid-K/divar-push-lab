apply plugin: 'com.android.application'

def oneSignalProperties = new Properties()
def oneSignalFile = file('onesignal.properties')
if (oneSignalFile.exists()) {
    oneSignalFile.withInputStream { oneSignalProperties.load(it) }
}
def oneSignalAppId = oneSignalProperties.getProperty('app_id', '').trim()
def oneSignalSender = oneSignalProperties.getProperty('sender_id', '').trim()

// A public checkout builds without a Firebase project. Adding a fresh lab
// app/google-services.json activates cloud registration for this package.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
    // The preserved APK uses OneSignal 3.15.3, whose Play Services constraints
    // predate the lab's current Firebase Messaging API. Keep the exact SDK.
    googleServices { disableVersionCheck = true }
}

android {
    namespace 'org.hamidk.divarpushlab'
    compileSdk 34

    defaultConfig {
        applicationId 'org.hamidk.divarpushlab'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '1.2-handler-logic'
        manifestPlaceholders = [
            onesignal_app_id: oneSignalAppId,
            onesignal_google_project_number: oneSignalSender
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
    // OneSignal 3.15.3 obtains its push token through FirebaseInstanceId.
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation('com.onesignal:OneSignal:3.15.3') {
        exclude group: 'com.android.support'
    }
}
