apply plugin: 'com.android.application'

// A public checkout builds without a Firebase project. Adding a fresh lab
// app/google-services.json activates cloud registration for this package.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'org.hamidk.divarpushlab'
    compileSdk 34

    defaultConfig {
        applicationId 'org.hamidk.divarpushlab'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1-cloud-lab'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-messaging'
}
